name: Publish NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "yes" to publish packages to npm'
        required: true
        default: 'no'

jobs:
  publish-npm:
    if: github.event_name == 'push' || github.event.inputs.confirm_publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate manual publish branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "publish" ]]; then
            echo "Manual publish must run from the publish branch. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate tag publish branch
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          git fetch origin publish:refs/remotes/origin/publish
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/publish; then
            echo "Tag publish must point to a commit already contained in the publish branch."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Publish packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            yarn release:publish --expected-version "${GITHUB_REF_NAME#v}"
          else
            yarn release:publish
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  notify-success:
    needs: publish-npm
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare notification
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV

      - name: Notify publish success
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "小程序 SDK NPM 发布通知",
                "text": "### ✅ 小程序 SDK NPM 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📝 提交信息: [${{ env.COMMIT_MESSAGE }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看发布详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify secondary DingTalk group on success
        uses: zcong1993/actions-ding@master
        with:
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "小程序 SDK NPM 发布通知",
                "text": "### ✅ 小程序 SDK NPM 发布成功\n\n---\n\n 🔖 分支/标签: ${{ github.ref }}\n\n 📝 提交信息: [${{ env.COMMIT_MESSAGE }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n\n 👨‍💻 触发人: ${{ github.actor }}\n\n 🚀 [查看发布详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
